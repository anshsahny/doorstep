[project]
name = "doorstep"
version = "0.1.0"
description = "Doorstep: a neighbour check-in agent for dangerous-weather alerts. Built with Strands Agents on Amazon Bedrock AgentCore."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Strands Agents SDK: core + Cedar authorization + experimental bidi (voice) + OTEL export
    "strands-agents[cedar,bidi,otel]>=1.55.1,<2",
    "strands-agents-tools>=0.8.8,<1",
    # Amazon Bedrock AgentCore Python SDK (runtime entrypoint, memory)
    "bedrock-agentcore>=1.22.0,<2",
    "boto3>=1.43",
    "pydantic>=2.11,<3",
    "pyyaml>=6",
    "httpx>=0.28",
    "python-dotenv>=1.1",
    # Channels
    "twilio>=9.11,<10",
    "websockets>=13",
    # Voice bridge
    "fastapi>=0.133",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1",
    "ruff>=0.16",
    "pre-commit>=4.6",
    # Strands Evals (Phase 6 eval suites)
    "strands-agents-evals>=1.2,<2",
]
# Local microphone/speaker for voice tests. Needs the PortAudio system library (brew install portaudio).
voice-local = [
    "strands-agents[bidi-pyaudio]>=1.55.1,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent/doorstep_agent"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    # Project generated by `agentcore create` for smoke test 03
    "scripts/smoke/03_agentcore_hello/DoorstepHello",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["doorstep_agent", "_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
