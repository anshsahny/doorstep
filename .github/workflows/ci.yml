name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0 # setup-uv publishes exact tags only, no floating v10
        with:
          enable-cache: true
      - run: uv python install 3.12
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: uv sync --frozen --group infra
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run --group infra pytest -q

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
