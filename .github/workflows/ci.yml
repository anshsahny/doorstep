name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0 # setup-uv publishes exact tags only, no floating v10
        with:
          enable-cache: true
      - run: uv python install 3.12
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: uv sync --frozen --group infra
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run --group infra pytest -q

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Full history on every run (under a second here). gitleaks-action scans only the pushed
      # range as `<first>^..<last>`, which fails when a push starts at the root commit (a
      # rewritten history), and reports that as an error rather than a scan.
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner --exit-code 1 /repo 2>&1 | tee gitleaks.log
          # A git error inside the container scans nothing and would pass silently.
          grep -Eq '[1-9][0-9]* commits scanned' gitleaks.log
